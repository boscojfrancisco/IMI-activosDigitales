<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperación</title><style>body{font:16px system-ui;background:#f2f5f7;color:#233347;max-width:480px;margin:50px auto;padding:0 16px}form{background:white;border:1px solid #dce2e8;border-radius:8px;padding:20px}label{display:block;margin:15px 0}input{display:block;padding:9px;width:95%;font:inherit}button{padding:10px 20px;background:#234f78;color:white;border:0;border-radius:4px}</style></head><body><h1>Recuperar contraseña</h1><p>El código lo entrega un administrador.</p><form id="form"><label>Código<input name="codigo" required autocomplete="off"></label><label>Contraseña nueva<input name="nueva" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>Repetir contraseña<input name="repetir" type="password" required autocomplete="new-password"></label><button>Establecer contraseña</button></form><p id="status" role="status"></p><script>const pathPrefix=window.location.pathname.replace(/\/pilot-recovery\/?$/,'');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),status=document.querySelector('#status');if(f.nueva!==f.repetir){status.textContent='Las contraseñas no coinciden.';return}try{const r=await fetch(pathPrefix+'/api/auth/recovery',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({codigo:f.codigo,nueva:f.nueva})});if(!r.ok)throw Error('Código inválido o vencido, o no se pudo completar la operación.');e.target.reset();status.textContent='Contraseña establecida. Ya podés iniciar sesión.'}catch(e){status.textContent=e.message}};</script></body></html>
