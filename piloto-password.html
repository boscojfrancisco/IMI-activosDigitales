<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambio de contraseña</title><style>body{font:16px system-ui;background:#f2f5f7;color:#233347;max-width:480px;margin:50px auto;padding:0 16px}form{background:white;border:1px solid #dce2e8;border-radius:8px;padding:20px}label{display:block;margin:15px 0}input{display:block;padding:9px;width:95%;font:inherit}button{padding:10px 20px;background:#234f78;color:white;border:0;border-radius:4px}</style></head><body><h1>Cambio de contraseña</h1><p>Ingresá tu contraseña actual y elegí una nueva.</p><form id="form"><label>Usuario<input name="usuario" required autocomplete="username"></label><label>Contraseña actual<input name="actual" type="password" required autocomplete="current-password"></label><label>Contraseña nueva<input name="nueva" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>Repetir contraseña nueva<input name="repetir" type="password" required autocomplete="new-password"></label><button>Cambiar contraseña</button></form><p id="status" role="status"></p><script>const pathPrefix=window.location.pathname.replace(/\/pilot-password\/?$/,'');
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const msg=document.querySelector('#status');if(f.nueva!==f.repetir){msg.textContent='Las contraseñas nuevas no coinciden.';return}try{const login=await fetch(pathPrefix+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:f.usuario,password:f.actual})});if(!login.ok)throw Error('No se pudo iniciar sesión.');const {token}=await login.json();const change=await fetch(pathPrefix+'/api/auth/password',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({actual:f.actual,nueva:f.nueva})});if(!change.ok)throw Error('No se pudo cambiar la contraseña.');e.target.reset();msg.textContent='Contraseña cambiada. Volvé a iniciar sesión.'}catch(e){msg.textContent=e.message}};
</script></body></html>
